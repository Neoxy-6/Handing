[project]
name = "Handing"
version = "1.0.0"
description = "Control PC with your Hands"
requires-python = ">=3.10"

dependencies = [
    "mediapipe>=1.0",
    "pynput",
    "pyyaml",
    "PySide6-Essentials",
]

[project.optional-dependencies]
dev = ["pytest", "nuitka", "psutil", "scikit-learn"]
gamepad = ["vgamepad"]  # pip install pops up the ViGEmBus driver installer

[project.scripts]
handing = "handing.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"